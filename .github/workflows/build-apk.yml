name: Build MousePointerSettings v0.6

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'v06src/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify full source package
        shell: bash
        run: |
          set -euo pipefail
          cat v06src/part00.txt v06src/part01.txt v06src/part02.txt v06src/part03.txt v06src/part04.txt v06src/part05.txt v06src/part06.txt > v06.b64
          base64 --decode v06.b64 > MousePointerSettings-v0.6-system-package.zip
          echo "bfb3021e36aa4d342ea448705ae6849fadb72edefee13310ed433e8604799b5c  MousePointerSettings-v0.6-system-package.zip" | sha256sum -c -
          unzip -t MousePointerSettings-v0.6-system-package.zip
          unzip -q MousePointerSettings-v0.6-system-package.zip
          test -f MousePointerSettings-v0.6-system-package/app/build.gradle
          ! grep -R "setCustomPointerIcon\|android.os.ServiceManager\|IInputManager" MousePointerSettings-v0.6-system-package/app/src/main/java

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: MousePointerSettings-v0.6-system-package
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='MousePointerSettings-v0.6-system-package/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/MousePointerSettings-v0.6.apk
          sha256sum dist/MousePointerSettings-v0.6.apk | tee dist/SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/MousePointerSettings-v0.6.apk | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MousePointerSettings-v0.6
          path: |
            dist/MousePointerSettings-v0.6.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 7
