name: Build MousePointerSettings v0.6 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'buildsrc/**'
      - 'patch-v06/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v0.5 base and apply v0.6 safe-session patch
        shell: bash
        run: |
          set -euo pipefail
          cat buildsrc/part00.txt buildsrc/part01.txt buildsrc/part02.txt buildsrc/part03.txt buildsrc/part04.txt buildsrc/part05.txt buildsrc/part06.txt > source.b64
          base64 --decode source.b64 > source.zip
          unzip -t source.zip
          unzip -q source.zip
          test -f MousePointerSettings-v0.5-source/app/build.gradle
          cp -a patch-v06/app/. MousePointerSettings-v0.5-source/app/
          rm -f MousePointerSettings-v0.5-source/app/src/main/java/com/pointer/settings/actual/ShizukuPointerController.java
          grep -q "versionName '0.6.0'" MousePointerSettings-v0.5-source/app/build.gradle
          grep -q "안전 세션 적용 · v0.6" MousePointerSettings-v0.5-source/app/src/main/assets/index.html
          ! grep -R "rikka.shizuku\|HiddenApiBypass" MousePointerSettings-v0.5-source/app/src/main MousePointerSettings-v0.5-source/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: MousePointerSettings-v0.5-source
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='MousePointerSettings-v0.5-source/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/MousePointerSettings-v0.6-safe-session.apk
          sha256sum dist/MousePointerSettings-v0.6-safe-session.apk | tee dist/SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/MousePointerSettings-v0.6-safe-session.apk | tee dist/BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/MousePointerSettings-v0.6-safe-session.apk | tee dist/SIGNATURE.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MousePointerSettings-v0.6-safe-session
          path: |
            dist/MousePointerSettings-v0.6-safe-session.apk
            dist/SHA256.txt
            dist/BADGING.txt
            dist/SIGNATURE.txt
          if-no-files-found: error
          retention-days: 7
