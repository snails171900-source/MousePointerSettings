name: Build MousePointerSettings v0.9

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'v09src/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct, verify and unpack v0.9 source
        shell: bash
        run: |
          set -euo pipefail
          echo "6a3e451ce9faa2a1edf87c88046f203b8224ffcf912ae1b47be8647b8133bba4  v09src/part00.txt" | sha256sum -c -
          echo "2801bfe5493bbe970bb73708d34f3e587b9ec5d78258717c0532911b1f50cfa7  v09src/part01.txt" | sha256sum -c -
          echo "28f598713f5746259e6f189ccf52b704468e63d57cb3e640e12cdd237aaffef7  v09src/part02.txt" | sha256sum -c -
          echo "64d8a42a1827e507e2b65c51a32b3986052dc0e5441776d996a0e352684d14bf  v09src/part03.txt" | sha256sum -c -
          echo "48f9d7ab06ac0a916bc62e2b9f2ae02a3d354977e351f7db37e90494dd7ab03e  v09src/part04.txt" | sha256sum -c -
          echo "4613acf8e9d95c4ff11bf3cf46d25ad803947151301bd428993947be569e96bf  v09src/part05.txt" | sha256sum -c -
          echo "75548200331e4f9b65e47eb874c2be77c8da54754155ab40b48fa8c0d3a9e486  v09src/part06.txt" | sha256sum -c -
          echo "0943d54b1c885da28abdba26f806e599df593733a37a3abbbd5c836a91cd5092  v09src/part07.txt" | sha256sum -c -
          cat v09src/part00.txt v09src/part01.txt v09src/part02.txt v09src/part03.txt v09src/part04.txt v09src/part05.txt v09src/part06.txt v09src/part07.txt > v09.b64
          base64 --decode v09.b64 > MousePointerSettings-v0.9-system-package.zip
          echo "ba534401b6446921a038424b884b7a35481ecddab6acf6388e597958677a0936  MousePointerSettings-v0.9-system-package.zip" | sha256sum -c -
          unzip -t MousePointerSettings-v0.9-system-package.zip
          unzip -q MousePointerSettings-v0.9-system-package.zip
          test -f MousePointerSettings-v0.9-system-package/app/build.gradle
          grep -q "versionCode 9" MousePointerSettings-v0.9-system-package/app/build.gradle
          grep -q 'dev.rikka.shizuku:api' MousePointerSettings-v0.9-system-package/app/build.gradle
          grep -q 'setCustomPointerIcon' MousePointerSettings-v0.9-system-package/app/src/main/java/com/pointer/settings/actual/SystemPointerUserService.java
          grep -q 'setPointerIconType' MousePointerSettings-v0.9-system-package/app/src/main/java/com/pointer/settings/actual/SystemPointerUserService.java
          ! grep -R -E 'BIND_ACCESSIBILITY_SERVICE|android\.accessibilityservice|SYSTEM_ALERT_WINDOW' MousePointerSettings-v0.9-system-package/app/src/main
          # Keep is only an R8 hint. Debug build does not minify; remove the annotation so
          # the UserService stays dependency-light and the final source archive matches the build.
          sed -i '/import androidx.annotation.Keep;/d;/^[[:space:]]*@Keep[[:space:]]*$/d' MousePointerSettings-v0.9-system-package/app/src/main/java/com/pointer/settings/actual/SystemPointerUserService.java

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: MousePointerSettings-v0.9-system-package
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='MousePointerSettings-v0.9-system-package/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/MousePointerSettings-v0.9.apk
          sha256sum dist/MousePointerSettings-v0.9.apk | tee dist/SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/MousePointerSettings-v0.9.apk | head -20
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree dist/MousePointerSettings-v0.9.apk AndroidManifest.xml > dist/manifest-tree.txt
          ! grep -E 'BIND_ACCESSIBILITY_SERVICE|android\.accessibilityservice|SYSTEM_ALERT_WINDOW' dist/manifest-tree.txt
          zip -qr dist/MousePointerSettings-v0.9-system-package.zip MousePointerSettings-v0.9-system-package
          sha256sum dist/MousePointerSettings-v0.9-system-package.zip | tee dist/SOURCE_SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MousePointerSettings-v0.9
          path: |
            dist/MousePointerSettings-v0.9.apk
            dist/MousePointerSettings-v0.9-system-package.zip
            dist/SHA256.txt
            dist/SOURCE_SHA256.txt
            dist/manifest-tree.txt
          if-no-files-found: error
          retention-days: 7
