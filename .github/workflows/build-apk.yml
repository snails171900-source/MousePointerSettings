name: Build MousePointerSettings APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'buildsrc/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat buildsrc/part00.txt buildsrc/part01.txt buildsrc/part02.txt buildsrc/part03.txt buildsrc/part04.txt buildsrc/part05.txt buildsrc/part06.txt > source.b64
          base64 --decode source.b64 > source.zip
          unzip -t source.zip
          unzip -q source.zip
          test -f MousePointerSettings-v0.5-source/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: MousePointerSettings-v0.5-source
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='MousePointerSettings-v0.5-source/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/MousePointerSettings-v0.5-debug.apk
          sha256sum dist/MousePointerSettings-v0.5-debug.apk | tee dist/SHA256.txt
          ${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging dist/MousePointerSettings-v0.5-debug.apk | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MousePointerSettings-v0.5-debug
          path: |
            dist/MousePointerSettings-v0.5-debug.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 7
